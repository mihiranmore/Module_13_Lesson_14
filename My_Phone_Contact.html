<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Phone Contact</title>
    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    
    rel = "stylesheet">

    <style>
        body{background-color: #F0F0F2;}
        h1{color: #FF5A43;}
        .card_label{font-size: 11px; color: #999; text-transform: uppercase;}
        pre{font-size: 13px; color: #333;}
    </style>
</head>
<body class="py-4">

    <div class="container">

        <h1 class="mb-1">My  Phone Contact </h1>
        <p class="text-muted mb-4">
            Introduction to Objects in Javascript - Grade 4 - 6
        </p>

        <!--Contact Card -->

        <div class="card shadow-sm mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style="color: #FF5A43;">Contact details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card_label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card_label d-block">School</span>
                        <strong id="School">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card_label d-block">City</span>
                        <strong id="City">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card_label d-block">Phone</span>
                        <strong id="phone">-</strong>
                    </li>
                </ul>
            </div>
        </div>

        <!--Code Box -->
        <div class="card shadow-sm" style="max-width: 400px;">
            <div class="card-body">
                <h6 style="color : #FF5A43;">Javascript Object Used</h6>
                <pre id="codeDisplay"
                    class="bg-light p-3 rounded border mb-0">
                </pre>
            </div>
        </div>
    </div>

    <script>

        //Step 1 = Create the Contact object
        var mycontact = {
            name: "Mihiran More",
            phone: "9826873510",
            School: "Rajeshwar Hr. Sec. School",
            City: "Indore"
        };

        //Step 2 = Dot Notion
        var nameE1 = document.getElementById("name");
        var phoneE1 = document.getElementById("phone");
        nameE1.textContent = myContact.name;
        phoneE1.textContent = myContact.phone;

        //Step 3 = Bracket Notation
        var SchoolE1 = document.getElementById("School");
        var CityE1 = document.getElementById("City");
        SchoolE1.textContent = myContact ["School"]
        CityE1.textContent = mycontact["City"]

        //Show object in the code box 
        var codeE1 = document.getElementById("codeDisplay");
        codeE1.textContent = 
        'var myContact = {\n' +
        'name: "' +  myContact.name + ' ", \n' +
        'phone: "' +  myContact.phone + ' ", \n' +
        'school: "' +  myContact["School"] + ' ", \n' +
        'name: "' +  myContact["City"]+ ' ", \n' +
        '};';

    </script>
</body>
</html>
